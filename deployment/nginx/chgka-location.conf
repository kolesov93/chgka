# Include these locations inside the existing production HTTPS server block.
# The Docker frontend is intentionally reachable only through host loopback.
location = /chgka {
    return 308 /chgka/;
}

location ^~ /chgka/socket.io/ {
    limit_conn chgka_ws_connections 20;
    limit_req zone=chgka_ws_handshakes burst=12 nodelay;
    limit_req_status 429;

    proxy_pass http://127.0.0.1:18080;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 75s;
    proxy_send_timeout 75s;
    proxy_buffering off;
}

location ^~ /chgka/ {
    proxy_pass http://127.0.0.1:18080;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}
