services:
  backend:
    build: ./backend
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
      - ./fixtures:/fixtures:ro
      - ./runtime-data:/data
    environment:
      - PYTHONUNBUFFERED=1
      - CHGKA_ENV=development
      - QUESTIONS_PACK_PATH=/fixtures/sample_questions
      - ADMIN_PASSWORD=admin123
      - ALLOWED_ORIGINS=http://localhost:5173,http://localhost:4173
      - ADMIN_TOKEN_TTL_SECONDS=${ADMIN_TOKEN_TTL_SECONDS:-43200}
      - CHGKA_DB_PATH=/data/chgka.sqlite3

  frontend:
    build: ./frontend
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    # Прокидываем изменения кода в реальном времени
    environment:
      - CHOKIDAR_USEPOLLING=true
