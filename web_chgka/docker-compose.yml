services:
  backend:
    build: ./backend
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
      - ./fixtures:/fixtures:ro
    environment:
      - PYTHONUNBUFFERED=1
      - QUESTIONS_PACK_PATH=/fixtures/sample_questions

  frontend:
    build: ./frontend
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    # Прокидываем изменения кода в реальном времени
    environment:
      - CHOKIDAR_USEPOLLING=true

